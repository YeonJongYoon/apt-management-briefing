name: Daily Apartment Briefing

on:
  schedule:
    - cron: "0 4 * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-apartment-briefing-pages
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      BRIEFING_TOPIC: ${{ vars.BRIEFING_TOPIC }}
      BRIEFING_TIMEZONE: ${{ vars.BRIEFING_TIMEZONE }}
      SITE_URL: ${{ vars.SITE_URL }}

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Gemini search and summarize
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py build

      - name: Upload briefing page
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy briefing page
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send Kakao messages
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: python main.py send
